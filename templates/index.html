<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; }
    .box { max-width: 720px; margin: 30px auto; background: #fff; border-radius: 12px;
           box-shadow: 0 2px 10px rgba(0,0,0,.1); display: flex; flex-direction: column; height: 85vh; }
    h1 { font-size: 20px; margin: 0; padding: 16px; background: #1f3a5f; color: #fff; border-radius: 12px 12px 0 0; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; }
    .msg { margin: 8px 0; padding: 10px 14px; border-radius: 10px; max-width: 80%; white-space: pre-wrap; line-height: 1.4; }
    .user { background: #1f3a5f; color: #fff; margin-left: auto; }
    .bot { background: #e9edf2; color: #222; }
    form { display: flex; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 14px; border: none; font-size: 16px; outline: none; border-radius: 0 0 0 12px; }
    button { padding: 0 22px; border: none; background: #1f3a5f; color: #fff; font-size: 16px; cursor: pointer; border-radius: 0 0 12px 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🏠 Wasalt &amp; DarGlobal Property Chatbot</h1>
    <div id="chat">
      <div class="msg bot">Hi! Ask me about properties on Wasalt or DarGlobal.
Example: "Show me apartments for sale in Riyadh under 600,000"</div>
    </div>
    <form id="form">
      <input id="input" placeholder="Type your question..." autocomplete="off">
      <button>Send</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    function add(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      add(text, "user");
      input.value = "";
      const waiting = add("Thinking...", "bot");
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      waiting.textContent = data.reply;
    };
  </script>
</body>
</html>
